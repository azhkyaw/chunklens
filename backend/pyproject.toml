[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunklens"
dynamic = ["version"]
description = "The local-first inspector & retrieval debugger for ChromaDB."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Aung Zwe Htet Kyaw", email = "azhk.dev@gmail.com" },
]
keywords = [
  "chromadb",
  "rag",
  "vector-database",
  "embeddings",
  "retrieval",
  "retrieval-augmented-generation",
  "fastapi",
  "developer-tools",
  "local-first",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Topic :: Database :: Front-Ends",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "chromadb==1.5.9",
  "pydantic>=2.6,<3",
  "openai>=2.44.0,<3",
  "cohere>=5,<6",
  "voyageai>=0.2,<1",
]

[project.optional-dependencies]
local-embedders = ["sentence-transformers>=2,<6"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
chunklens = "chunklens.server:main"

[project.urls]
Homepage = "https://github.com/azhkyaw/chunklens"
Repository = "https://github.com/azhkyaw/chunklens"
Issues = "https://github.com/azhkyaw/chunklens/issues"

[tool.hatch.version]
path = "src/chunklens/__init__.py"

[tool.hatch.build.targets.wheel]
# src/chunklens/web (the built SPA) is gitignored, but an explicit `packages` entry overrides
# hatchling's VCS exclusion, so the wheel AND sdist already ship web/ (verified). Do NOT add a
# force-include for web/: it collides with packages ("a second file is being added at the same
# path: chunklens/web/index.html"). scripts/build_release.py asserts the SPA is inside the wheel
# as the release-time guard, and requires web/ to be built first.
packages = ["src/chunklens"]
