[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunklens"
version = "0.0.1"
description = "The local-first inspector & retrieval debugger for ChromaDB."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "chromadb>=1.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
chunklens = "chunklens.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chunklens"]
