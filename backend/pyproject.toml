[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chunklens"
dynamic = ["version"]
description = "The local-first inspector & retrieval debugger for ChromaDB."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "chromadb==1.5.9",
  "pydantic>=2.6,<3",
  "openai>=2.44.0,<3",
  "cohere>=5,<6",
  "voyageai>=0.2,<1",
]

[project.optional-dependencies]
local-embedders = ["sentence-transformers>=2,<6"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
chunklens = "chunklens.server:main"

[tool.hatch.version]
path = "src/chunklens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chunklens"]
